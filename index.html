
<script>
const WORKER_URL="https://nexora-ai-backend.pahadasingh-sasmita.workers.dev/";
const STORAGE_KEY="nexora_chats";

let speakingEnabled=true;
let selectedStudentTool="";
let recognition=null;
let chatHistory=[];

// BASIC FUNCTIONS
function showNotice(t){
  alert(t);
}

function showView(id){
  document.querySelectorAll('.view').forEach(v=>
    v.classList.toggle('active',v.id===id)
  );

  document.querySelectorAll('.navbtn[data-view]').forEach(b=>
    b.classList.toggle('active',b.dataset.view===id)
  );

  const names={
    dashboard:'Overview',
    chat:'AI Chat',
    student:'Student AI',
    image:'Image Studio',
    charts:'Chart Maker',
    voice:'Voice Assistant'
  };

  const crumb=document.getElementById('crumb');
  if(crumb) crumb.textContent=names[id]||id;

  window.scrollTo({top:0,behavior:'smooth'});
}

document.querySelectorAll('.navbtn[data-view]').forEach(b=>{
  b.addEventListener('click',()=>showView(b.dataset.view));
});

function searchTool(q){
  q=q.toLowerCase();

  const map=[
    ['chat',['chat','normal ai']],
    ['student',['student','homework','notes','quiz','study','presentation','coding']],
    ['image',['image','picture','generate']],
    ['charts',['chart','graph','data']],
    ['voice',['voice','speak','microphone']]
  ];

  for(const [view,words] of map){
    if(words.some(w=>q.includes(w))){
      showView(view);
      return;
    }
  }

  showView('student');
}

function openStudentTool(name,prefix){
  showView('student');
  selectTool(name,prefix);
}

function selectTool(name,prefix){
  selectedStudentTool=name;

  document.getElementById('selectedToolLabel').textContent=
    'Selected tool: '+name;

  document.getElementById('studentPrompt').value=prefix;
  document.getElementById('studentPrompt').focus();
}

// AI BACKEND
async function requestAI(messages,statusId){
  const status=document.getElementById(statusId);

  if(status) status.textContent='Connecting to TURVION AI...';

  const response=await fetch(WORKER_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages})
  });

  let data;

  try{
    data=await response.json();
  }catch{
    throw new Error('The server returned an unreadable response.');
  }

  if(!response.ok){
    throw new Error(data.error||data.message||'Server error '+response.status);
  }

  const reply=
    data.response||
    data.reply||
    data.result||
    data.output||
    data.text||
    data.content||
    data.message;

  if(typeof reply!=='string'||!reply.trim()){
    throw new Error('The AI returned an empty response.');
  }

  if(status) status.textContent='● TURVION AI connected';

  return reply;
}

// CHAT
async function sendChat(){
  const input=document.getElementById('chatInput');
  const q=input.value.trim();

  if(!q) return;

  input.value='';

  const box=document.getElementById('chatMessages');

  addBubble(box,'user',q);
  chatHistory.push({role:'user',content:q});

  const load=addBubble(box,'ai','TURVION is thinking...');

  try{
    const reply=await requestAI(
      chatHistory.slice(-20),
      'chatStatus'
    );

    load.textContent=reply;
    load.dataset.content=reply;

    chatHistory.push({role:'assistant',content:reply});

    if(speakingEnabled){
      speakText(reply,document.getElementById('language').value);
    }

  }catch(e){
    load.textContent='Sorry, I could not connect. '+e.message;
    document.getElementById('chatStatus').textContent='Connection error';
  }
}

function addBubble(box,role,text){
  const el=document.createElement('div');

  el.className='bubble '+role;
  el.textContent=text;
  el.dataset.content=text;

  box.appendChild(el);
  box.scrollTop=box.scrollHeight;

  return el;
}

// SMART STUDENT AI
async function runStudentTool(){
  const prompt=document.getElementById('studentPrompt').value.trim();

  if(!prompt){
    document.getElementById('studentStatus').textContent=
      'Please enter a topic or question first.';
    return;
  }

  const output=document.getElementById('studentOutput');
  output.textContent='Working on your request...';

  try{
    const instruction=selectedStudentTool
      ?`You are TURVION AI, a helpful and age-appropriate school learning assistant. Tool: ${selectedStudentTool}. Explain clearly and use language suitable for the student's class. Encourage learning rather than copying blindly.\n\nStudent request: `
      :'';

    const reply=await requestAI(
      [{role:'user',content:instruction+prompt}],
      'studentStatus'
    );

    output.textContent=reply;

    if(speakingEnabled){
      speakText(reply,document.getElementById('language').value);
    }

  }catch(e){
    output.textContent='Could not generate a response: '+e.message;
    document.getElementById('studentStatus').textContent='Connection error';
  }
}

// IMAGE GENERATION
async function generateImage(){
  const prompt=document.getElementById('imagePrompt').value.trim();
  const status=document.getElementById('imageStatus');
  const out=document.getElementById('imageOutput');

  if(!prompt){
    status.textContent='Please describe your image first.';
    return;
  }

  status.textContent='Generating image...';
  out.innerHTML='';

  try{
    const res=await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        action:'generate-image',
        prompt
      })
    });

    let data;

    try{
      data=await res.json();
    }catch{
      throw new Error('Unreadable server response');
    }

    if(!res.ok){
      throw new Error(data.error||data.message||'Image generation failed');
    }

    const src=data.image||data.image_url||data.url||data.result;

    if(typeof src!=='string'||
       (!/^https?:\/\//i.test(src)&&!/^data:image\//i.test(src))){
      throw new Error('Worker did not return a supported image URL.');
    }

    const img=document.createElement('img');

    img.src=src;
    img.alt='Generated by TURVION AI';
    img.className='resultimg';

    out.appendChild(img);
    status.textContent='Image generated.';

  }catch(e){
    status.textContent='Image generation error: '+e.message;
  }
}

// CHART MAKER
function makeChart(){
  const labels=document.getElementById('chartLabels').value
    .split(',').map(x=>x.trim()).filter(Boolean);

  const values=document.getElementById('chartValues').value
    .split(',').map(x=>Number(x.trim()));

  const title=document.getElementById('chartTitle').value.trim()||'My Chart';
  const area=document.getElementById('chartArea');

  if(!labels.length||
     labels.length!==values.length||
     values.some(v=>!Number.isFinite(v)||v<0)){
    area.textContent='Please enter matching labels and non-negative numbers.';
    return;
  }

  const max=Math.max(...values,1);

  area.innerHTML='';

  const h=document.createElement('div');
  h.style.cssText='font-weight:700;margin-bottom:8px';
  h.textContent=title;
  area.appendChild(h);

  const bars=document.createElement('div');
  bars.className='chartbars';

  labels.forEach((label,i)=>{
    const bar=document.createElement('div');

    bar.className='chartbar';
    bar.style.height=Math.max(4,values[i]/max*145)+'px';

    const n=document.createElement('em');
    n.textContent=values[i];

    const l=document.createElement('span');
    l.textContent=label;

    bar.append(n,l);
    bars.appendChild(bar);
  });

  area.appendChild(bars);
}

// MICROPHONE INPUT
function startVoice(targetId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SR){
    alert('Speech recognition is not supported in this browser. Try Chrome.');
    return;
  }

  try{
    if(recognition) recognition.stop();
  }catch(e){}

  recognition=new SR();

  const lang=(
    targetId==='voicePrompt'
      ?document.getElementById('voiceLanguage').value
      :document.getElementById('language').value
  );

  recognition.lang=lang;
  recognition.interimResults=false;
  recognition.maxAlternatives=1;

  const statusId=
    targetId==='voicePrompt'?'voiceStatus':'chatStatus';

  document.getElementById(statusId).textContent='Listening...';

  recognition.onresult=e=>{
    const t=e.results[0][0].transcript;
    const el=document.getElementById(targetId);

    el.value+=(el.value?' ':'')+t;

    document.getElementById(statusId).textContent='Voice captured';
  };

  recognition.onerror=e=>{
    document.getElementById(statusId).textContent=
      'Voice error: '+e.error;
  };

  recognition.onend=()=>{
    if(document.getElementById(statusId).textContent==='Listening...'){
      document.getElementById(statusId).textContent='Listening stopped.';
    }
  };

  recognition.start();
}

// VOICE MODE QUESTION
async function sendVoiceQuestion(){
  const q=document.getElementById('voicePrompt').value.trim();
  const out=document.getElementById('voiceOutput');

  if(!q){
    document.getElementById('voiceStatus').textContent=
      'Speak or type a question first.';
    return;
  }

  out.textContent='TURVION is thinking...';

  try{
    const reply=await requestAI(
      [{role:'user',content:q}],
      'voiceStatus'
    );

    out.textContent=reply;

    if(speakingEnabled){
      speakText(reply,document.getElementById('voiceLanguage').value);
    }

  }catch(e){
    out.textContent='Could not connect: '+e.message;
  }
}

// SPOKEN REPLIES ON/OFF
function toggleSpeech(){
  speakingEnabled=!speakingEnabled;

  const b=document.getElementById('speechToggle');

  if(b){
    b.textContent=speakingEnabled
      ?'🔊 Spoken replies: On'
      :'🔇 Spoken replies: Off';
  }

  if(!speakingEnabled&&'speechSynthesis'in window){
    speechSynthesis.cancel();
  }
}

// LANGUAGE VOICE CHECKER
function checkHindiVoice(){
  if(!('speechSynthesis'in window)){
    alert('Speech is not supported in this browser.');
    return;
  }

  const voices=speechSynthesis.getVoices();

  const hindi=voices.filter(v=>
    v.lang.toLowerCase().startsWith('hi')
  );

  const odia=voices.filter(v=>
    v.lang.toLowerCase().startsWith('or')
  );

  alert(
    'HINDI VOICES:\n'+
    (hindi.length?hindi.map(v=>v.name+' ('+v.lang+')').join('\n'):'None found')+
    '\n\nODIA VOICES:\n'+
    (odia.length?odia.map(v=>v.name+' ('+v.lang+')').join('\n'):'None found')
  );
}

// HINDI / ODIA / ENGLISH TEXT-TO-SPEECH
function speakText(text,selectedLanguage){
  if(!speakingEnabled||!('speechSynthesis'in window)){
    return;
  }

  speechSynthesis.cancel();

  const lang=selectedLanguage||'en-US';
  const languageCode=lang.split('-')[0].toLowerCase();

  function speakWhenReady(){
    const voices=speechSynthesis.getVoices();

    const matchingVoice=voices.find(v=>
      v.lang.toLowerCase()===lang.toLowerCase()
    )||voices.find(v=>
      v.lang.toLowerCase().startsWith(languageCode)
    );

    if(!matchingVoice&&languageCode!=='en'){
      alert('No voice found for '+lang+
        '. Please install a supported language voice.');
      return;
    }

    const utterance=new SpeechSynthesisUtterance(text);
    utterance.lang=lang;
    utterance.rate=0.9;
    utterance.pitch=1;

    if(matchingVoice){
      utterance.voice=matchingVoice;
    }

    speechSynthesis.speak(utterance);
  }

  if(speechSynthesis.getVoices().length>0){
    speakWhenReady();
  }else{
    speechSynthesis.onvoiceschanged=speakWhenReady;
  }
}

// LOAD BROWSER VOICES
if('speechSynthesis'in window){
  speechSynthesis.onvoiceschanged=()=>{
    speechSynthesis.getVoices();
  };

  speechSynthesis.getVoices();
}

// SEARCH
const quickSearch=document.getElementById('quickSearch');

if(quickSearch){
  quickSearch.addEventListener('input',e=>{
    if(!e.target.value){}
  });
}
</script>
